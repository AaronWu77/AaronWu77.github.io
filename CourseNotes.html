<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes - Yuchen Wu</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* 针对论文列表的特定样式 */
        .paper-list-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .paper-item {
            background: rgba(20, 20, 20, 0.7); /* 半透明黑背景 */
            border: 1px solid #333;
            border-left: 3px solid #bc13fe; /* 紫色左边框 */
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
        }

        .paper-item:hover {
            transform: translateX(10px); /* 悬停时轻微右移 */
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            border-left-color: #00f3ff;
        }

        .paper-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(188, 19, 254, 0.5);
        }

        .paper-abstract {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .paper-meta {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .read-btn {
            display: inline-block;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid #bc13fe;
            color: #bc13fe;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .read-btn:hover {
            background: #bc13fe;
            color: #000;
            box-shadow: 0 0 15px #bc13fe;
        }
        
        /* 装饰性编号 */
        .paper-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.05); /* 非常淡的背景字 */
            font-weight: 900;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 背景光效 -->
    <div class="background-glow"></div>
    
    <div class="header">
        <h1>Course Notes</h1>
        <p>Lots of Notes</p>
        <a href="index.html" style="color: #bc13fe; text-decoration: none; border: 1px solid #bc13fe; padding: 5px 10px; font-size: 0.8rem; margin-top: 15px; display: inline-block; transition: all 0.3s;">&larr; Back to Home</a>
    </div>

    <div class="section paper-list-container" id="course-notes-list">
        <p style="color: #666; text-align: center;">Loading course notes...</p>
    </div>

    <!-- 交互脚本 -->
    <script src="assets/js/script.js"></script>
    <script>
        const courseNotesList = document.getElementById('course-notes-list');
        fetch('assets/data/content-manifest.json')
            .then((response) => {
                if (!response.ok) throw new Error('Failed to load content manifest');
                return response.json();
            })
            .then((manifest) => {
                const notes = manifest.courseNotes || [];
                courseNotesList.innerHTML = notes.map((note, index) => `
                    <div class="paper-item">
                        <div class="paper-number">${String(index + 1).padStart(2, '0')}</div>
                        <div class="paper-title">${note.title}</div>
                        <div class="paper-meta">${note.date}</div>
                        <div class="paper-abstract">${note.summary}</div>
                        <a href="${note.url}" class="read-btn">Read Notes &rarr;</a>
                    </div>
                `).join('');
            })
            .catch((error) => {
                console.error('Error loading course notes list:', error);
                courseNotesList.innerHTML = '<p style="color: red; text-align: center;">Error loading course notes list.</p>';
            });
    </script>
</body>
</html>
