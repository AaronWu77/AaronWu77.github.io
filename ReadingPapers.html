<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Papers - Yuchen Wu</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- 背景光效 -->
    <div class="background-glow"></div>
    
    <div class="header">
        <h1>Reading Papers</h1>
        <p>Exploration & Insights in Computer Science</p>
        <a href="index.html" class="header-back-link">&larr; Back to Home</a>
    </div>

    <div class="section paper-list-container" id="reading-papers-list">
        <p style="color: #666; text-align: center;">Loading reading papers...</p>
    </div>

    <!-- 交互脚本 -->
    <script src="assets/js/script.js"></script>
    <script>
        const readingPapersList = document.getElementById('reading-papers-list');
        fetch('assets/data/content-manifest.json')
            .then((response) => {
                if (!response.ok) throw new Error('Failed to load content manifest');
                return response.json();
            })
            .then((manifest) => {
                const papers = manifest.readingPapers || [];
                readingPapersList.innerHTML = papers.map((paper, index) => `
                    <div class="paper-item">
                        <div class="paper-number">${String(index + 1).padStart(2, '0')}</div>
                        <div class="paper-title">${paper.title}</div>
                        <div class="paper-meta">${paper.meta}</div>
                        <div class="paper-abstract">${paper.summary}</div>
                        <a href="${paper.url}" class="read-btn">Read Notes &rarr;</a>
                    </div>
                `).join('');
            })
            .catch((error) => {
                console.error('Error loading reading papers list:', error);
                readingPapersList.innerHTML = '<p style="color: red; text-align: center;">Error loading reading papers list.</p>';
            });
    </script>
</body>
</html>
